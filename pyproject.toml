[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "trading-env"
version = "0.2.0"
description = "Single-asset trading environment for reinforcement learning: C++20 core, pybind11 bindings, Gymnasium wrapper."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Artem Hontarenko" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "gymnasium>=0.29"]

[project.optional-dependencies]
test = ["pytest>=7"]
experiments = ["stable-baselines3>=2.3", "pandas>=2.0", "matplotlib>=3.7"]

[tool.scikit-build]
minimum-version = "0.10"
wheel.packages = ["python/trading_env"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"
TRADING_ENV_BUILD_EXAMPLES = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
